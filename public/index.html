<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>SayCar · Đặt Hộ</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>SayCar · Đặt Hộ</h1>
      <p>Đặt chuyến hộ khách — kết nối thẳng hệ thống</p>
    </div>

    <!-- ĐĂNG NHẬP -->
    <div id="view-login" class="card">
      <h2>Đăng nhập</h2>
      <label>Số điện thoại</label>
      <input id="login-phone" type="tel" inputmode="tel" placeholder="09xxxxxxxx" autocomplete="username" />
      <label>Mật khẩu</label>
      <input id="login-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
      <div id="login-msg" class="msg"></div>
      <button class="btn" onclick="doLogin()">Đăng nhập</button>
      <div class="center" style="margin-top:14px"><button class="btn link" onclick="show('register')">Chưa có tài khoản? Đăng ký</button></div>
    </div>

    <!-- ĐĂNG KÝ -->
    <div id="view-register" class="card hidden">
      <h2>Đăng ký</h2>
      <label>Số điện thoại</label>
      <input id="reg-phone" type="tel" inputmode="tel" placeholder="09xxxxxxxx" autocomplete="username" />
      <label>Mật khẩu (tối thiểu 6 ký tự)</label>
      <input id="reg-pass" type="password" placeholder="Mật khẩu" autocomplete="new-password" />
      <label>Xác nhận mật khẩu</label>
      <input id="reg-pass2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" />
      <div id="reg-msg" class="msg"></div>
      <button class="btn" onclick="doRegister()">Đăng ký</button>
      <div class="center" style="margin-top:14px"><button class="btn link" onclick="show('login')">Đã có tài khoản? Đăng nhập</button></div>
    </div>

    <!-- APP -->
    <div id="view-app" class="hidden">
      <div class="topbar">
        <span class="u">Xin chào, <b id="me-name"></b></span>
        <span>
          <a id="admin-link" class="plain hidden" href="/admin.html" style="color:#fff">Quản trị</a>
          <button class="btn link" style="color:#fff" onclick="logout()">Đăng xuất</button>
        </span>
      </div>

      <div class="card earn-card">
        <div class="earn-label">Thu nhập của bạn (đã chốt)</div>
        <div class="earn-total" id="earn-total">—</div>
        <div class="earn-sub" id="earn-sub"></div>
      </div>

      <div id="noti-banner" class="card hidden" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="muted" style="font-size:13px">🔔 Bật thông báo để nhận cập nhật chuyến kể cả khi không mở app.</span>
        <button class="btn sm" onclick="enableNotifications()">Bật</button>
      </div>

      <div class="card">
        <h2>Tạo chuyến mới</h2>
        <label><span class="dot from"></span>Điểm đón *</label>
        <div class="ac"><input id="b-pickup" type="text" autocomplete="off" placeholder="Gõ địa chỉ đón rồi chọn gợi ý" /><div id="ac-pickup" class="ac-list hidden"></div></div>
        <label><span class="dot to"></span>Điểm đến *</label>
        <div class="ac"><input id="b-dropoff" type="text" autocomplete="off" placeholder="Gõ địa chỉ đến rồi chọn gợi ý" /><div id="ac-dropoff" class="ac-list hidden"></div></div>
        <div class="row">
          <div><label>Loại xe</label><select id="b-vehicle"></select></div>
          <div><label>Thanh toán</label><select id="b-payment"></select></div>
        </div>
        <label>Tên khách hàng</label>
        <input id="b-cname" type="text" placeholder="Tên khách" />
        <label>Số điện thoại khách *</label>
        <input id="b-cphone" type="tel" inputmode="tel" placeholder="09xxxxxxxx" />
        <button class="btn secondary" id="b-preview" onclick="doPreview()">Tính giá</button>
        <div id="b-price" class="price-box hidden"></div>
        <div id="b-msg" class="msg"></div>
        <button class="btn hidden" id="b-submit" onclick="doBooking()">Xác nhận đặt chuyến</button>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">Chuyến tôi đã đặt</h2>
          <button class="btn link" onclick="loadHistory()">↻ Làm mới</button>
        </div>
        <div id="history" style="margin-top:12px"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
